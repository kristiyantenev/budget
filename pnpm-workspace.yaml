packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  sharp: true
  esbuild: true
  cpu-features: true
  protobufjs: true
  ssh2: true

blockExoticSubdeps: true
trustPolicy: no-downgrade
# semver@6.3.1 is a 2023 release that predates npm provenance, pulled in
# transitively by @babel/core and next. The missing attestation is an age
# artefact, not a takeover; the lockfile pins it by integrity hash.
trustPolicyExclude:
  - "semver@6.3.1"
